<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResumeScore</title><style>
body{font-family:Arial;margin:0;background:#f6f8fc;color:#182033}.wrap{max-width:850px;margin:50px auto;padding:20px}
.card{background:white;padding:28px;border-radius:18px;box-shadow:0 10px 35px #00000012;margin-top:20px}
h1{font-size:46px;margin:10px 0}p{color:#657084}.upload{border:2px dashed #cdd3df;padding:30px;text-align:center;border-radius:12px}
input[type=file]{margin:15px}textarea{width:100%;height:150px;border:1px solid #d7dce6;border-radius:10px;padding:12px;box-sizing:border-box}
button{margin-top:15px;width:100%;padding:14px;background:#5959ee;color:white;border:0;border-radius:10px;font-weight:bold;font-size:16px}
#out{display:none}.score{font-size:55px;font-weight:800;color:#5959ee}.box{background:#f6f7fb;padding:15px;margin:10px 0;border-radius:10px}
</style></head><body><div class="wrap">
<p>AI-powered resume analysis</p><h1>Check Your Resume Before You Apply.</h1>
<p>Upload your resume and paste the job description to get an ATS score, missing skills and AI suggestions.</p>
<div class="card"><form id="f">
<div class="upload"><input id="resume" type="file" accept=".pdf,.docx" required></div>
<textarea id="job" placeholder="Paste the job description here..." required></textarea>
<button>Analyze My Resume</button></form></div>
<div class="card" id="out"></div></div>
<script>
f.onsubmit=async e=>{e.preventDefault();let fd=new FormData();fd.append('resume',resume.files[0]);fd.append('job_description',job.value);
out.style.display='block';out.innerHTML='<p>Analyzing…</p>';let r=await fetch('/api/analyze',{method:'POST',body:fd});let d=await r.json();
if(!r.ok){out.innerHTML='<b>Error:</b> '+(d.detail||'Something went wrong');return}
out.innerHTML=`<div>ATS match score</div><div class="score">${d.ats_score}/100</div>
<div class="box"><b>Strengths</b><br>${(d.strengths||[]).join(', ')}</div>
<div class="box"><b>Missing skills</b><br>${(d.missing_skills||[]).join(', ')}</div>
<div class="box"><b>Improvements</b><br>${(d.improvements||[]).map(x=>'• '+x).join('<br>')}</div>
<div class="box"><b>AI summary</b><br>${d.rewritten_summary||''}</div>`}
</script></body></html>
